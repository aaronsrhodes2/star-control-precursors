[project]
name = "scz"
version = "0.0.1"
description = "Star Control Zero: The Precursors — a fan-game prequel"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Aaron Rhodes", email = "aaron.s.rhodes2@gmail.com"}]
license = {text = "Non-commercial fan project"}
dependencies = [
    "pygame-ce>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
scz = "scz.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scz*"]
